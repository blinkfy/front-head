<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16835e">
  <title>分投侠通话</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header><span class="brand-mark">分</span><span>分投侠</span><span class="secure">安全通话</span></header>
    <section id="content" class="card"><div class="spinner"></div><h1>正在连接通话</h1><p>请稍候</p></section>
  </main>
  <script>
    setTimeout(function () {
      var content = document.querySelector('#content')
      if (content && content.querySelector('.spinner')) content.innerHTML = '<h1>通话页面加载超时</h1><p>请检查网络后重新打开。</p><button onclick="location.reload()">重新加载</button>'
    }, 12000)
    window.addEventListener('error', function (event) {
      if (event.target && event.target.tagName === 'SCRIPT') {
        var content = document.querySelector('#content')
        if (content) content.innerHTML = '<h1>通话页面资源加载失败</h1><p>请检查网络后重新打开。</p><button onclick="location.reload()">重新加载</button>'
      }
    }, true)
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
