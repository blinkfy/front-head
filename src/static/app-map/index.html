<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>地图</title>
  <link rel="preconnect" href="https://map.qq.com">
  <link rel="preconnect" href="https://mapvectors.map.qq.com" crossorigin>
  <link rel="preconnect" href="https://vectorsdk.map.qq.com" crossorigin>
  <link rel="modulepreload" href="./renderer.mjs">
  <script>
    // Start the SDK download while the iframe and its bridge are being initialized.
    const options = new URLSearchParams(location.hash.split('?')[1] || '')
    const sdkKey = options.get('sdk')
    if (sdkKey) {
      const preload = document.createElement('link')
      preload.rel = 'preload'
      preload.as = 'script'
      preload.href = 'https://map.qq.com/api/gljs?v=1.exp&key=' + encodeURIComponent(sdkKey)
      document.head.appendChild(preload)
    }
  </script>
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    #map { touch-action: none; }
    #map-error { display: none; position: fixed; inset: 0; box-sizing: border-box; padding: 20px; color: #333; background: #fff; font: 14px/1.5 sans-serif; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="map-error" role="alert"></div>
  <script type="module" src="./host.mjs"></script>
</body>
</html>
