<!doctype html>
<html><head><meta charset="utf-8"><title>地图资源预加载</title></head><body>
<script>
// Match the map's file:// parent + loopback iframe cache partition.
document.addEventListener('plusready', function () {
  var current = plus.webview.currentWebview()
  var url = current.sdkPreloadUrl
  var frameUrl = current.frameUrl
  if (typeof url !== 'string' || !/^https:\/\/map\.qq\.com\/api\/gljs\?/.test(url) ||
      typeof frameUrl !== 'string' || !/^http:\/\/127\.0\.0\.1:\d+\/[^/]+\/index\.html$/.test(frameUrl)) { current.close('none'); return }
  var started = Date.now()
  var target = new URL(frameUrl)
  var key = new URL(url).searchParams.get('key')
  if (!key) { current.close('none'); return }
  var frame = document.createElement('iframe')
  frame.src = frameUrl + '#sdk-preload:' + encodeURIComponent(key)
  var finish = function (phase) {
    console.info('[app-map-preload] ' + phase + ' ' + JSON.stringify({ elapsedMs: Date.now() - started }))
    document.title = 'app-map-sdk-' + phase
  }
  window.addEventListener('message', function (event) {
    if (event.source === frame.contentWindow && event.origin === target.origin && event.data &&
        event.data.channel === 'app-map-sdk-preload' && ['loaded', 'failed'].indexOf(event.data.phase) >= 0) finish(event.data.phase)
  })
  frame.onerror = function () { finish('failed') }
  document.body.appendChild(frame)
}, { once: true })
</script></body></html>
